<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填報完成｜2027 一見傾薪</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#d4f1ed,#f8f9d6 50%,#fceab2);color:#23462c;min-height:100vh}header img{width:100%;display:block}.wrap{max-width:760px;margin:30px auto 80px;padding:0 18px}.card{background:#fffef7;border:1px solid #dce7c5;border-radius:24px;padding:40px 32px;text-align:center;box-shadow:0 12px 35px #286c3c18}.check{display:inline-grid;place-items:center;width:76px;height:76px;border-radius:50%;background:#e6f4d5;color:#286c3c;font-size:42px;font-weight:800}h1{color:#286c3c;font-size:32px;margin:18px 0 6px}.sub{color:#61755d}.details{background:#f3f8e9;border-radius:14px;padding:20px;margin:26px 0;text-align:left;overflow-wrap:anywhere}.details p{margin:7px 0}.label{color:#698066;font-size:13px}.value{font-weight:800;font-size:18px}.notice{background:#fff6d9;padding:16px;border-radius:12px;text-align:left;font-size:14px;line-height:1.8}footer{text-align:center;font-size:12px;color:#5d785d;margin:26px 0}@media(max-width:600px){.card{padding:30px 20px}h1{font-size:27px}}</style></head><body><header><img src="banner.png" alt="2027春季校園徵才活動 一見傾薪"></header><main class="wrap"><div class="card"><div class="check" aria-hidden="true">✓</div><h1>企業名冊資料填報完成</h1><p class="sub">系統已收到並確認儲存您的填報資料。</p><div class="details"><p class="label">企業名稱</p><p class="value" id="company">—</p><p class="label">填報編號</p><p class="value" id="receipt">—</p></div><div class="notice">請保留此頁面或截圖紀錄填報編號，以利後續查詢。<strong>資料送出後無法自行修改</strong>，如需更正請聯絡主辦單位。<br>本頁表示資料已成功送交系統，不代表內容已完成主辦單位審核。</div></div><footer>國立臺北科技大學｜2027 春季就業博覽會 · 一見傾薪</footer></main><script>const q=new URLSearchParams(location.search);document.getElementById('company').textContent=q.get('company')||'未提供';document.getElementById('receipt').textContent=q.get('receipt')|
